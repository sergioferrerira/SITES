<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Camazo Barbershop · Aveiro</title>
<meta name="description" content="Camazo Barbershop, Rua Conselheiro Luís de Magalhães, Aveiro. Cortes, barba, Black Mask e combos. Marca online em segundos.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="Camazo Barbershop · Aveiro">
<meta property="og:description" content="A oficina do corte, no centro de Aveiro. Marca online.">
<meta property="og:image" content="img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --tecto: #0b0b0c;
    --parede: #eeeeeb;
    --parede-2: #dcdcd8;
    --tinta: #111113;
    --cinza: #9a9aa1;
    --cinza-2: #66666d;
    --vermelho: #d01c2c;
    --vermelho-esc: #8f0f1c;
    --vermelho-claro: #ee3a48;
    --azul: #1f4fb0;
    --cromado-1: #f4f4f4;
    --cromado-2: #9ea2a8;
    --cromado-3: #5b5f66;
    --espuma: #141416;
    --espuma-2: #1c1c1f;
    --led: #f4f8ff;
    --raio: 12px;
    --max: 1120px;
    --chao: repeating-conic-gradient(#ecebe7 0 25%, #333336 0 50%) 0 0 / 20px 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { font-family: Inter, system-ui, sans-serif; color: #f2f2f0; line-height: 1.55; overflow-x: hidden; background: #161618; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  h1, h2, h3 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  :focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }

  /* ---------- botões tipo placa de oficina ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 24px; border-radius: 10px; font-weight: 800; font-size: .92rem; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; transition: transform .12s, box-shadow .12s, filter .2s; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-vermelho { color: #fff; background: linear-gradient(#e2283a, #b3121f); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 #6f0a14, 0 10px 20px rgba(0,0,0,.35); }
  .btn-vermelho:hover { filter: brightness(1.08); }
  .btn-vermelho:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 #6f0a14, 0 4px 10px rgba(0,0,0,.35); }
  .btn-cromado { color: #1a1a1c; background: linear-gradient(var(--cromado-1), #c7cacf 55%, #a9adb3); box-shadow: inset 0 1px 0 #fff, 0 4px 0 #6b6f75, 0 10px 20px rgba(0,0,0,.25); }
  .btn-cromado:active { transform: translateY(3px); box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6b6f75; }
  .btn[disabled] { opacity: .35; pointer-events: none; }

  /* ---------- TECTO: cabeçalho com calha de cabos e LEDs ---------- */
  header { position: fixed; inset: 0 0 auto; z-index: 60; background: var(--tecto); border-bottom: 1px solid #000; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  header::before { /* calha de cabos em rede */
    content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 8px; opacity: .35;
    background: repeating-linear-gradient(90deg, #6b6b70 0 1px, transparent 1px 14px), linear-gradient(#6b6b70, #6b6b70) top / 100% 1px no-repeat, linear-gradient(#6b6b70, #6b6b70) bottom / 100% 1px no-repeat;
  }
  .nav { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 18px; position: relative; }
  .logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: #fff; }
  .logo .script { font-family: Yellowtail, cursive; font-size: 1.95rem; line-height: 1; }
  .logo small { font-size: .6rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: var(--cinza); }
  .menu { display: flex; align-items: center; gap: 24px; list-style: none; }
  .menu a { text-decoration: none; font-size: .86rem; font-weight: 600; color: #cfcfd4; }
  .menu a:hover { color: #fff; }
  .menu .btn { padding: 10px 18px; font-size: .78rem; color: #fff; }
  .burger { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; }
  .burger span, .burger span::before, .burger span::after { display: block; width: 22px; height: 2px; background: #fff; position: relative; transition: transform .25s, background .25s; }
  .burger span::before, .burger span::after { content: ""; position: absolute; left: 0; }
  .burger span::before { top: -7px; } .burger span::after { top: 7px; }
  .aberto .burger span { background: transparent; }
  .aberto .burger span::before { transform: translateY(7px) rotate(45deg); }
  .aberto .burger span::after { transform: translateY(-7px) rotate(-45deg); }

  .leds { position: absolute; left: 0; right: 0; bottom: -7px; height: 7px; pointer-events: none; }
  .led { position: absolute; top: 0; height: 7px; width: 18%; border-radius: 4px; background: #3b3b40; transition: background .2s; }
  .led:nth-child(1) { left: 6%; } .led:nth-child(2) { left: 41%; } .led:nth-child(3) { left: 76%; }
  .acesas .led { background: var(--led); box-shadow: 0 0 6px #fff, 0 0 18px rgba(220,232,255,.9), 0 14px 60px 10px rgba(220,232,255,.35); }
  .acesas .led:nth-child(1) { animation: ligar 1.1s steps(1) both; }
  .acesas .led:nth-child(2) { animation: ligar 1.1s .25s steps(1) both; }
  .acesas .led:nth-child(3) { animation: ligar 1.1s .5s steps(1) both; }
  @keyframes ligar { 0% { opacity: .15; } 12% { opacity: 1; } 18% { opacity: .2; } 30% { opacity: 1; } 36% { opacity: .35; } 48%, 100% { opacity: 1; } }

  /* ---------- PAREDE: hero ---------- */
  .parede { position: relative; color: #f2f2f0; padding: 130px 0 90px; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; overflow: hidden;
    background:
      radial-gradient(ellipse 14% 40% at 15% 0%, rgba(240,246,255,.28), transparent 70%),
      radial-gradient(ellipse 14% 40% at 50% 0%, rgba(240,246,255,.28), transparent 70%),
      radial-gradient(ellipse 14% 40% at 85% 0%, rgba(240,246,255,.28), transparent 70%),
      linear-gradient(90deg, rgba(10,10,12,.8), rgba(10,10,12,.5) 55%, rgba(10,10,12,.32)),
      var(--chao); background-size: auto, auto, auto, auto, 264px 264px; }
  .apagado .parede { filter: brightness(.25); }
  .parede { transition: filter 1.1s steps(6); }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 50px; align-items: center; position: relative; z-index: 2; }
  .script-grande { font-family: Yellowtail, cursive; font-size: clamp(4.4rem, 12vw, 8.6rem); line-height: .9; color: #fff; margin-left: -4px; text-shadow: 0 0 6px rgba(255,255,255,.6), 0 0 26px rgba(255,255,255,.35), 0 4px 18px rgba(0,0,0,.8); }
  .hero h1 { font-size: clamp(1.4rem, 3.2vw, 2.1rem); letter-spacing: .16em; color: #b9b9bf; margin: 10px 0 20px; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  .hero h1 b { font-weight: 400; color: #fff; }
  .hero .lead { color: #d4d4d8; max-width: 50ch; font-size: 1.05rem; margin-bottom: 28px; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  .hero-acoes { display: flex; flex-wrap: wrap; gap: 14px; }
  .estado { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 8px 14px 8px 10px; background: #111; color: #e8e8e8; border-radius: 8px; font-size: .78rem; }
  .estado { cursor: pointer; border: 0; font: inherit; font-size: .78rem; } .estado:hover { background: #1b1b1d; }
  .estado-seta { font-size: 1.1em; opacity: .7; margin-left: -2px; }
  .estado .luz { width: 10px; height: 10px; border-radius: 50%; background: #39d26b; box-shadow: 0 0 8px #39d26b, 0 0 2px #fff inset; }
  .estado.fechado .luz { background: var(--vermelho); box-shadow: 0 0 8px var(--vermelho); }
  /* o armário vermelho (SVG) */
  .armario { position: relative; justify-self: center; width: min(100%, 440px); }
  .armario .legenda { font-family: "JetBrains Mono", monospace; font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #b0b0b6; text-shadow: 0 1px 6px #000; text-align: center; margin-top: 14px; }
  #armario { position: relative; container-type: inline-size; }
  #armario > img { width: 100%; height: auto; display: block; filter: drop-shadow(-16px 30px 26px rgba(0,0,0,.6)) drop-shadow(0 4px 5px rgba(0,0,0,.45)); user-select: none; -webkit-user-drag: none; }
  .bv-cav { position: absolute; background: #160306; box-shadow: inset 0 1.2cqw 1.6cqw rgba(0,0,0,.95); border-radius: .5cqw; pointer-events: none; }
  .bv-g { position: absolute; background-image: url(img/bancada-vermelha.webp); background-repeat: no-repeat; border-radius: .5cqw; cursor: pointer; outline: none;
    transition: transform .5s cubic-bezier(.25,1.35,.5,1), box-shadow .5s, filter .3s; }
  .bv-g::before { /* caixa da gaveta, vista por cima quando sai */
    content: ""; position: absolute; left: 1.5%; right: 1.5%; bottom: 100%; height: 0; pointer-events: none;
    background: linear-gradient(#070708, #1d1d20 60%, #2e2e33); border-radius: .4cqw .4cqw 0 0;
    clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%); transition: height .5s cubic-bezier(.25,1.35,.5,1); }
  .bv-g::after { /* calhas laterais metálicas */
    content: ""; position: absolute; inset: auto 0 100% 0; height: 0; pointer-events: none;
    background: linear-gradient(90deg, #9da1a7 0 1.5%, transparent 1.5% 98.5%, #9da1a7 98.5%); transition: height .5s cubic-bezier(.25,1.35,.5,1); }
  .bv-g:hover, .bv-g:focus-visible, .bv-g.puxa { transform: translateY(2.4cqw) scale(1.03); box-shadow: 0 2.6cqw 3.4cqw rgba(0,0,0,.6), 0 .6cqw .8cqw rgba(0,0,0,.4); filter: brightness(1.06); z-index: 3; }
  .bv-g:hover::before, .bv-g:focus-visible::before, .bv-g.puxa::before,
  .bv-g:hover::after, .bv-g:focus-visible::after, .bv-g.puxa::after { height: 2.6cqw; }
  .bv-g:active { transform: translateY(3.6cqw) scale(1.045); }
  .bv-g:focus-visible { box-shadow: 0 0 0 .6cqw #1f4fb0, 0 2.6cqw 3.4cqw rgba(0,0,0,.6); }
  .bv-fita { position: absolute; left: 50%; transform: translateX(-50%) rotate(-.6deg); font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: clamp(6px, 1.85cqw, 10.5px); letter-spacing: .16em; line-height: 1.35; color: #f2f2f2; background: linear-gradient(#2a2a2d, #0d0d0f); padding: .15em .7em .1em; border-radius: 2px; white-space: nowrap; box-shadow: 0 1px 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); pointer-events: none; }
  .bv-placa { position: absolute; display: grid; place-items: center; pointer-events: none; color: #ededed; }
  .bv-placa.topo { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: clamp(6px, 1.9cqw, 10px); letter-spacing: .14em; }
  .bv-placa.marca { font-family: Yellowtail, cursive; font-size: clamp(10px, 3.3cqw, 18px); }
  .poste { position: absolute; z-index: 3; right: max(16px, calc(50% - 600px)); top: 120px; width: 46px; }
  .poste .tampa { height: 16px; background: linear-gradient(90deg, #111, #555 40%, #111); border-radius: 8px 8px 3px 3px; }
  .poste .vidro { height: 170px; margin: 0 5px; border-radius: 4px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), 0 0 28px rgba(208,28,44,.35); }
  .poste .vidro::before { content: ""; position: absolute; inset: -80px 0 0; background: repeating-linear-gradient(-45deg, var(--vermelho) 0 12px, #fff 12px 24px, var(--azul) 24px 36px, #fff 36px 48px); animation: girar 2.2s linear infinite; }
  .poste .vidro::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), rgba(255,255,255,.45) 35%, transparent 60%, rgba(0,0,0,.3)); }
  .poste .base { height: 22px; background: linear-gradient(90deg, #111, #555 40%, #111); border-radius: 3px 3px 14px 14px; }
  @keyframes girar { to { transform: translateY(68px); } }


  /* rodapé: faixa a correr com as riscas da barbearia, sempre no fundo do ecrã */
  .faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #0f0f10; border-top: 1px solid #000; box-shadow: 0 -8px 24px rgba(0,0,0,.5); overflow: hidden; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
  .faixa-track { display: flex; width: max-content; animation: correr 40s linear infinite; }
  .faixa span { font-family: Anton, sans-serif; text-transform: uppercase; font-size: 1.1rem; letter-spacing: .08em; color: #cfcfd3; white-space: nowrap; display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; }
  .faixa span::after { content: ""; width: 26px; height: 8px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--vermelho) 0 5px, #fff 5px 10px, var(--azul) 10px 15px, #fff 15px 20px); }
  @keyframes correr { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .faixa-track { animation: none; } }
  .mergulhado .faixa { visibility: hidden; }
  .fita { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: #111; padding: 5px 12px; border-radius: 3px; box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 2px 6px rgba(0,0,0,.5); margin-bottom: 16px; }

  /* ---------- A BANCADA (caixa de ferramentas) ---------- */
  .bancada { max-width: 980px; margin: 0 auto; position: relative; filter: drop-shadow(0 40px 50px rgba(0,0,0,.55)); }
  .bancada-topo { position: relative; height: 60px; border-radius: 14px 14px 0 0; background: linear-gradient(#e2283a, #b7131f); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .bancada-topo::before { /* tapete de borracha */ content: ""; position: absolute; left: 10px; right: 10px; top: -8px; height: 10px; border-radius: 6px 6px 2px 2px; background: repeating-linear-gradient(90deg, #1c1c1e 0 6px, #262629 6px 8px); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .placa { font-family: "JetBrains Mono", monospace; font-size: .72rem; font-weight: 700; letter-spacing: .14em; color: #fff; background: #111; padding: 6px 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px #444, 0 1px 0 rgba(255,255,255,.25); white-space: nowrap; }
  .parafusos { display: flex; gap: 10px; }
  .parafusos i { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #eee, #888 60%, #444); box-shadow: 0 1px 1px rgba(0,0,0,.4); position: relative; }
  .parafusos i::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4px; height: 2px; background: #555; transform: rotate(40deg); }
  .bancada-corpo { background: linear-gradient(90deg, #a00f1c, #c81a2a 6%, #cf1d2d 50%, #c81a2a 94%, #a00f1c); padding: 10px 14px 18px; border-radius: 0 0 14px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .bancada-fundo { display: flex; justify-content: center; padding-top: 14px; }
  .bancada-fundo .placa { font-family: Yellowtail, cursive; font-weight: 400; font-size: 1.15rem; letter-spacing: 0; text-transform: none; padding: 3px 14px; }

  .gaveta { margin-top: 10px; scroll-margin-top: 90px; }
  .frente { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; text-align: left; padding: 16px 18px 20px; border-radius: 6px; background: linear-gradient(#e0283a, #c3172a 70%, #a8121f); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25), 0 2px 0 #6c0912; position: relative; transition: transform .35s cubic-bezier(.3,1.4,.5,1), box-shadow .35s; }
  .frente:hover { filter: brightness(1.05); }
  .gaveta.alta .frente { padding-block: 24px 30px; }
  .puxador { grid-column: 1 / -1; order: 3; height: 12px; border-radius: 6px; margin: 4px 6% 0; background: linear-gradient(var(--cromado-1), #cfd2d6 40%, var(--cromado-2) 70%, var(--cromado-3)); box-shadow: 0 2px 3px rgba(0,0,0,.45), inset 0 1px 0 #fff; transition: transform .2s; }
  .frente:hover .puxador { transform: translateY(-1px); }
  .etiqueta { justify-self: start; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: #0f0f10; padding: 6px 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px #3a3a3a; }
  .frente .desc { font-size: .86rem; color: rgba(255,255,255,.85); font-weight: 500; }
  .frente .num { font-family: "JetBrains Mono", monospace; font-size: .72rem; color: rgba(255,255,255,.7); display: inline-flex; align-items: center; gap: 8px; }
  .frente .num svg { width: 16px; height: 16px; transition: transform .35s; }
  .gaveta.aberta .frente { transform: translateY(6px) scale(1.012); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 26px rgba(0,0,0,.45); z-index: 2; }
  .gaveta.aberta .frente .num svg { transform: rotate(180deg); }

  .interior { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.2,.8,.2,1); }
  .gaveta.aberta .interior { grid-template-rows: 1fr; }
  .interior > div { overflow: hidden; }
  .caixa { margin: 0 8px; padding: 22px; border-radius: 0 0 8px 8px; position: relative;
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,.035), transparent 40%), var(--espuma);
    box-shadow: inset 0 14px 18px -8px rgba(0,0,0,.9), inset 10px 0 0 -2px #8d8f94, inset -10px 0 0 -2px #8d8f94; /* calhas laterais */
  }
  .caixa::before { content: ""; position: absolute; inset: 0 12px; background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.2px); background-size: 6px 6px; pointer-events: none; }
  .caixa > * { position: relative; }

  /* recortes na espuma (serviços como ferramentas) */
  .ferramentas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .recorte { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: #0a0a0b; box-shadow: inset 0 3px 8px rgba(0,0,0,.95), inset 0 -1px 0 rgba(255,255,255,.06); }
  .recorte .ic { width: 54px; height: 54px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(#2a2a2e, #1b1b1e); box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
  .recorte .ic svg { width: 30px; height: 30px; }
  .recorte h3 { font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: .98rem; font-weight: 700; line-height: 1.25; }
  .recorte .meta { font-size: .78rem; color: var(--cinza-2); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .poupa { font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #75e69a; background: rgba(57,210,107,.12); border-radius: 4px; padding: 1px 6px; }
  .recorte .lado { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .preco { font-family: Anton, sans-serif; font-size: 1.15rem; color: #111; background: #f1d34a; padding: 2px 10px 1px; border-radius: 3px; position: relative; transform: rotate(-3deg); box-shadow: 0 2px 4px rgba(0,0,0,.4); white-space: nowrap; }
  .preco::before { content: ""; position: absolute; left: -6px; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: #0a0a0b; transform: translateY(-50%); box-shadow: inset 0 0 0 2px #f1d34a; }
  .preco small { font-family: Inter, sans-serif; font-size: .58rem; font-weight: 700; margin-right: 3px; text-transform: uppercase; }
  .mini { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--vermelho); border-radius: 6px; padding: 5px 9px; }
  .mini:hover { background: var(--vermelho-claro); }
  .nota { font-size: .8rem; color: var(--cinza-2); margin-top: 16px; }

  /* galeria na gaveta */
  .fotos { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 130px; gap: 12px; }
  .fotos figure { position: relative; border-radius: 8px; overflow: hidden; cursor: zoom-in; background: #000; box-shadow: 0 0 0 6px #0a0a0b, inset 0 0 0 1px #000; }
  .fotos figure.g2 { grid-row: span 2; } .fotos figure.l2 { grid-column: span 2; }
  .fotos img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }

/* --- o chão: o mosaico da barbearia ---
   Pastilhas cinza-escuras e brancas: losangos escuros com uma pastilha branca
   no centro, contornados por uma escada dupla de pastilhas brancas. Repete a
   cada 12 pastilhas. Cada pastilha tem tom, brilho e aresta próprios. */
(function () {
  try {
    let seed = 11;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const P = 12, T = 44, N = P, c = document.createElement("canvas");
    c.width = c.height = N * T;
    const g = c.getContext("2d");
    const centros = [[0, 0], [P, 0], [0, P], [P, P], [P / 2, P / 2]];
    const branco = (x, y) => { const r = Math.min(...centros.map(([a, b]) => Math.abs(x - a) + Math.abs(y - b))); return r === 0 || r === 3 || r === 4; };
    // junta (argamassa) com grão
    g.fillStyle = "#8d8d8a"; g.fillRect(0, 0, c.width, c.height);
    for (let k = 0; k < 9000; k++) { g.fillStyle = `rgba(${rnd() < .5 ? "40,40,40" : "220,220,215"},${.15 + rnd() * .2})`; g.fillRect(rnd() * c.width, rnd() * c.height, 1, 1); }
    const G = 4; // largura da junta (canvas a 2x)
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const w = branco(x, y), v = (rnd() - .5) * (w ? 6 : 8);
      const base = w ? [238 + v, 237 + v, 232 + v] : [70 + v, 71 + v, 76 + v];
      const x0 = x * T + G / 2, y0 = y * T + G / 2, L = T - G;
      // corpo da pastilha com leve gradiente
      const gr = g.createLinearGradient(x0, y0, x0 + L, y0 + L);
      gr.addColorStop(0, `rgb(${base.map((n) => Math.min(255, n + 12)).join()})`);
      gr.addColorStop(1, `rgb(${base.map((n) => n - 12).join()})`);
      g.fillStyle = gr;
      g.beginPath(); g.roundRect ? g.roundRect(x0, y0, L, L, 4) : g.rect(x0, y0, L, L); g.fill();
      // aresta: luz em cima/esquerda, sombra em baixo/direita
      g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(x0 + 2, y0 + 1, L - 4, 2); g.fillRect(x0 + 1, y0 + 2, 2, L - 4);
      g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(x0 + 2, y0 + L - 3, L - 4, 2); g.fillRect(x0 + L - 3, y0 + 2, 2, L - 4);
      // brilho vidrado
      const br = g.createRadialGradient(x0 + L * .3, y0 + L * .25, 0, x0 + L * .3, y0 + L * .25, L * .7);
      br.addColorStop(0, `rgba(255,255,255,${w ? .25 : .12})`); br.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = br; g.fillRect(x0, y0, L, L);
      // grão e pequenos riscos de uso
      for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(${w ? "0,0,0" : "255,255,255"},${rnd() * .07})`; g.fillRect(x0 + rnd() * L, y0 + rnd() * L, 1, 1); }
      if (rnd() < .12) { g.strokeStyle = `rgba(${w ? "0,0,0" : "255,255,255"},.08)`; g.beginPath(); const a = rnd() * L, b = rnd() * L; g.moveTo(x0 + a, y0 + b); g.lineTo(x0 + a + (rnd() - .5) * 10, y0 + b + (rnd() - .5) * 10); g.stroke(); }
    }
    document.documentElement.style.setProperty("--chao", `url(${c.toDataURL()})`);
  } catch (e) {}
})();

function agoraLisboa() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday);
  return { wd, min: Number(p.hour) * 60 + Number(p.minute), data: new Date(Number(p.year), Number(p.month) - 1, Number(p.day)) };
}

   TRANSIÇÃO CINEMATOGRÁFICA PARA DENTRO DA GAVETA
   A secção inteira onde está a gaveta (parede de mosaico, bancada, texto) é
   clonada para um palco 3D. A câmara faz dolly-in sobre esse palco, a gaveta
   desliza a direito para fora da bancada (só no eixo Z, sem desvio lateral),
   a câmara passa por cima da frente metálica, inclina-se até ficar a olhar
   de cima e desce até a espuma ocupar o ecrã inteiro.
   Para nada perder qualidade, o palco é construído ampliado (zoom = k) e
   começa afastado da câmara; no fim fica à escala 1:1.
   --------------------------------------------------------------------- */
const caminho = (de, ate) => { const c = []; for (let e = ate; e !== de; e = e.parentElement) c.unshift([...e.parentElement.children].indexOf(e)); return c; };
const seguir = (raiz, c) => c.reduce((e, i) => e.children[i], raiz);

function montarCena(origem) {
  const sec = origem.closest("section") || document.body;
  const rs = sec.getBoundingClientRect(), ro = origem.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight, cxv = vw / 2, cyv = vh / 2;
  const w = origem.offsetWidth, h = origem.offsetHeight;         // medidas sem zoom
  const D = w * .8;                                               // fundo da gaveta
  const k = Math.max(vw / w, vh / D) * 1.04;                      // ampliação total até a espuma encher o ecrã
  const zk = Math.min(k, devicePixelRatio >= 2 ? 1.5 : 2.4);       // zoom do palco (nitidez sem estourar a memória)
  const P = Math.max(vw, vh) * 1.15;                              // distância da câmara

  // duas câmaras iguais em camadas separadas: a parede/bancada atrás e a gaveta à frente.
  // A gaveta está sempre à frente da parede, por isso não há planos a ordenar entre as duas.
  const cena = document.createElement("div");
  cena.className = "c3-cena"; cena.setAttribute("aria-hidden", "true");
  const camada = () => { const c = document.createElement("div"); Object.assign(c.style, { position: "absolute", inset: 0, perspective: P + "px", perspectiveOrigin: "50% 50%" }); cena.appendChild(c); return c; };
  const camA = camada(), camB = camada(), camC = camada();
  const mundo = document.createElement("div"); mundo.className = "c3-mundo";
  const mundoG = document.createElement("div"); mundoG.className = "c3-mundo";
  const mundoF = document.createElement("div"); mundoF.className = "c3-mundo";
  const palco = sec.cloneNode(true);
  palco.classList.add("c3-palco"); palco.removeAttribute("id");
  Object.assign(palco.style, { left: rs.left + "px", top: rs.top + "px", width: rs.width + "px", height: rs.height + "px", zoom: zk });
  mundo.appendChild(palco); camA.appendChild(mundo); camB.appendChild(mundoG); camC.appendChild(mundoF); document.body.appendChild(cena);

  // no palco (plano, em z = 0) a gaveta escolhida passa a ser o buraco escuro da bancada
  const gp = seguir(palco, caminho(sec, origem));
  gp.classList.remove("puxa");
  Object.assign(gp.style, { backgroundImage: "none", background: "#160306", boxShadow: "inset 0 10px 14px rgba(0,0,0,.95)", filter: "none", transform: "none", transition: "none" });
  gp.querySelectorAll("*").forEach((e) => (e.style.visibility = "hidden"));

  // a gaveta 3D, irmã do palco no mesmo espaço: caixa + frente, no sítio exato da gaveta real
  const gav = document.createElement("div");
  gav.className = "c3-gaveta";
  Object.assign(gav.style, { left: (ro.left + ro.width / 2) * zk + "px", top: (ro.top + ro.height / 2) * zk + "px" });
  mundoG.appendChild(gav);
  const face = (cls, fw, fh, t) => { const f = document.createElement("div"); f.className = "c3-face " + cls; fw *= zk; fh *= zk; Object.assign(f.style, { width: fw + "px", height: fh + "px", marginLeft: -fw / 2 + "px", marginTop: -fh / 2 + "px", transform: t }); gav.appendChild(f); return f; };
  const Z = (n) => n * zk; // medidas do mundo (o palco está ampliado zk vezes)
  const fundo = face("c3-fundo-gav", w - 6, D, `translate3d(0, ${Z(h / 2 - 2)}px, ${Z(-D / 2 - 3)}px) rotateX(90deg)`);
  fundo.style.backgroundSize = `auto, ${420 * zk / k}px ${420 * zk / k}px, auto`;
  // (as paredes não tocam na frente: planos encostados confundem a ordenação 3D do browser)
  const ladoE = face("c3-lado", D - 6, h - 2, ""), ladoD = face("c3-lado", D - 6, h - 2, "");
  // a caixa só existe à frente da bancada: planos que atravessam a parede baralham a ordenação 3D do browser
  const caixaAte = (zSaida) => {
    const L = Math.max(.5, Math.min(D, zSaida - 1));
    const fw = Z(w - 6), fl = Z(L), lh = Z(h - 2), ll = Z(Math.max(1, L - 6));
    Object.assign(fundo.style, { height: fl + 'px', marginTop: -fl / 2 + 'px', transform: `translate3d(0, ${Z(h / 2 - 2)}px, ${-fl / 2 - Z(3)}px) rotateX(90deg)` });
    for (const [el, sx, ry] of [[ladoE, -1, 90], [ladoD, 1, -90]]) Object.assign(el.style, { width: ll + 'px', marginLeft: -ll / 2 + 'px', transform: `translate3d(${sx * Z(w / 2 - 3)}px, 0, ${-ll / 2 - Z(4)}px) rotateY(${ry}deg)` });
  };
  // a frente é uma cópia da própria gaveta (com etiquetas); letras do contentor (cqw) passam a px
  const g = origem.cloneNode(true);
  const tams = [...origem.querySelectorAll(".bv-fita, .bv-placa")].map((e) => getComputedStyle(e).fontSize);
  g.querySelectorAll(".bv-fita, .bv-placa").forEach((e, i) => { e.style.fontSize = tams[i]; });
  g.removeAttribute("id"); g.removeAttribute("tabindex"); g.classList.remove("puxa");
  const cs = getComputedStyle(origem);
  Object.assign(g.style, { position: "absolute", left: -w / 2 + "px", top: -h / 2 + "px", width: w + "px", height: h + "px", margin: 0, zoom: zk,
    transform: "translateZ(1px)", transition: "none", visibility: "visible", filter: "none", boxShadow: "none",
    backgroundImage: cs.backgroundImage, backgroundSize: cs.backgroundSize, backgroundPosition: cs.backgroundPosition, backgroundRepeat: cs.backgroundRepeat, backgroundColor: cs.backgroundColor });
  const gavF = gav.cloneNode(false); mundoF.appendChild(gavF);
  gavF.appendChild(g);

  // câmara: transform do mundo = translate(X,Y,Z) · rotateX(a) · translate(-F)
  // F = centro do fundo da gaveta quando aberta (coordenadas do mundo, já com zoom)
  const puxar = D * .92;
  mundo.style.transform = mundoG.style.transform = mundoF.style.transform = "none";
  const fr = g.getBoundingClientRect();
  const F = { x: fr.left + fr.width / 2, y: fr.top + fr.height / 2 + (h * zk) / 2, z: (puxar - D / 2) * zk };
  const cam = { X: 0, Y: 0, Z: 0, a: 0 }, gv = { z: 0 };
  const aplicar = () => {
    mundo.style.transform = mundoG.style.transform = mundoF.style.transform = `translate3d(${cam.X}px, ${cam.Y}px, ${cam.Z}px) rotateX(${cam.a}deg) translate3d(${-F.x}px, ${-F.y}px, ${-F.z}px)`;
    gav.style.transform = gavF.style.transform = `translateZ(${gv.z * zk}px)`;
    caixaAte(palco.style.visibility === 'hidden' ? D + 10 : gv.z);
  };
  // ponto de partida: o palco afastado, a parecer exatamente a página
  cam.X = F.x + cxv * (1 - zk); cam.Y = F.y + cyv * (1 - zk); cam.Z = F.z + P * (1 - zk);
  aplicar();
  for (let i = 0; i < 3; i++) { // acerto fino com a gaveta real (escala e posição)
    const m = g.getBoundingClientRect();
    const esc = m.width / ro.width;
    if (Math.abs(esc - 1) > .002) { const s0 = P / (P - (cam.Z - F.z)); cam.Z = F.z + P * (1 - esc / s0); }
    aplicar();
    const m2 = g.getBoundingClientRect(), s1 = P / (P - (cam.Z - F.z));
    cam.X -= ((m2.left + m2.width / 2) - (ro.left + ro.width / 2)) / s1;
    cam.Y -= ((m2.top + m2.height / 2) - (ro.top + ro.height / 2)) / s1;
    aplicar();
  }
  const ini = { ...cam };
  // meio: a gaveta já saiu e a câmara aproximou-se; a frente vai a caminho do centro
  const sM = Math.max(.72 * vw / (w * zk), 1.8 / zk);
  const alvoX = ro.left + ro.width / 2 + (cxv - (ro.left + ro.width / 2)) * .65;
  const alvoY = ro.top + ro.height / 2 + (cyv - (ro.top + ro.height / 2)) * .5;
  const fW = { x: F.x, y: F.y - (h * zk) / 2 };
  const meio = { a: 0, Z: F.z - puxar * zk + P * (1 - 1 / sM) };
  meio.X = (alvoX - cxv) / sM + cxv - fW.x + F.x;
  meio.Y = (alvoY - cyv) / sM + cyv - fW.y + F.y;
  const fim = { X: cxv, Y: cyv, Z: P * (1 - zk / k), a: -89.2 };
  return { cena, palco, gav, g, cam, gv, aplicar, ini, meio, fim, puxar: puxar * zk / zk, k };
}

function linhaTempo(c) {
  const tl = gsap.timeline({ paused: true, onUpdate: c.aplicar });
  // 1) a gaveta desliza a direito para fora da bancada
  tl.to(c.gv, { z: c.puxar, duration: .7, ease: "power2.inOut" }, 0);
  // 2) dolly-in a acompanhar a gaveta
  tl.to(c.cam, { X: c.meio.X, Y: c.meio.Y, Z: c.meio.Z, duration: .7, ease: "power1.in" }, 0);
  // 3) a câmara passa por cima da frente, inclina-se e desce até à espuma
  tl.to(c.cam, { X: c.fim.X, Y: c.fim.Y, Z: c.fim.Z, duration: .85, ease: "power2.out" }, .7);
  tl.to(c.cam, { a: c.fim.a, duration: .85, ease: "power2.inOut" }, .62);
  // o resto da página escurece e o menu desaparece
  tl.to(c.cena, { backgroundColor: "rgba(5,5,6,1)", duration: .5, ease: "power1.in" }, .15);
  tl.to("#topo", { autoAlpha: 0, duration: .35, ease: "power1.out" }, 0);
  // já a olhar de cima: a parede e a bancada saem de cena, fica só a gaveta
  tl.set(c.palco, { visibility: "hidden" }, 1.12);
  tl.set(c.gav, { visibility: "visible" }, 1.12);
  return tl;
}

async function mergulhar(id, preferida) {
  if (mg.ocupado) return;
  if (!mg.el.hidden) { encherMergulho(id); mg.el.classList.remove("entrar"); void mg.el.offsetWidth; mg.el.classList.add("entrar"); return; }
  mg.ocupado = true;
  header.classList.remove("aberto"); burger.setAttribute("aria-expanded", false);
  const origem = origemPara(id, preferida);
  mg.origem = origem;
  mg.foco = document.activeElement;
  encherMergulho(id);
  let c = null;
  if (origem && window.gsap && !semMovimento()) {
    origem.classList.remove("puxa");
    c = montarCena(origem);
    origem.style.visibility = "hidden";
    c.tl = linhaTempo(c);
    await new Promise((r) => { c.tl.eventCallback("onComplete", r); c.tl.play(0); });
  }
  document.documentElement.classList.add("mergulhado");
  mg.el.hidden = false;
  mg.el.classList.remove("entrar"); void mg.el.offsetWidth; mg.el.classList.add("entrar");
  if (c) {
    await mg.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" }).finished.catch(() => {});
    c.cena.remove();
  }
  if (history.state?.gaveta == null) history.pushState({ gaveta: id }, "");
  $("#mg-fechar").focus({ preventScroll: true });
  mg.ocupado = false;
}

async function emergir(viaHistorico) {
  if (mg.el.hidden || mg.ocupado) return;
  mg.ocupado = true;
  const origem = mg.origem;
  let c = null;
  if (origem && window.gsap && !semMovimento()) {
    document.documentElement.classList.remove("mergulhado");
    origem.style.visibility = "";
    c = montarCena(origem);
    origem.style.visibility = "hidden";
    c.tl = linhaTempo(c);
    c.tl.progress(1);
    await mg.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: "ease-in" }).finished.catch(() => {});
  }
  mg.el.hidden = true;
  document.documentElement.classList.remove("mergulhado");
  $(`#i-${mg.atual} > div`).appendChild(mg.corpo.firstElementChild);
  mg.atual = null;
  if (c) {
    await new Promise((r) => { c.tl.eventCallback("onReverseComplete", r); c.tl.timeScale(1.15).reverse(); });
    c.cena.remove();
  }
  gsap?.set?.("#topo", { clearProps: "opacity,visibility" });
  if (origem) origem.style.visibility = "";
  if (!viaHistorico && history.state?.gaveta != null) history.back();
  (mg.foco && document.contains(mg.foco) ? mg.foco : origem)?.focus?.({ preventScroll: true });
  mg.ocupado = false;
}
$("#mg-fechar").addEventListener("click", () => emergir(false));
addEventListener("popstate", () => { if (!mg.el.hidden) emergir(true); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !mg.el.hidden && !$("#lightbox").classList.contains("on")) emergir(false); });
// botão "Marcar" dentro de uma gaveta de serviços: muda para a gaveta da marcação
mg.el.addEventListener("click", (e) => {
  const m = e.target.closest("[data-marcar]");
  if (m) { escolherServico(m.dataset.marcar); mergulhar("marcar"); }
});
// compatibilidade: quem chamava abrirGaveta passa a mergulhar
function abrirGaveta(id, _rolar, origem) { mergulhar(id, origem); }
document.querySelectorAll(".interior").forEach((el) => (el.inert = true));
$("#gavetas").addEventListener("click", (e) => {
  const f = e.target.closest(".frente");
  if (f) mergulhar(f.dataset.id, f);
});
document.querySelectorAll("a[data-gaveta], button[data-gaveta]").forEach((a) => a.addEventListener("click", (e) => {
  e.preventDefault();
  mergulhar(a.dataset.gaveta);
}));

/* --- menu mobile --- */
const header = $("#topo"), burger = $("#burger");
burger.addEventListener("click", () => burger.setAttribute("aria-expanded", header.classList.toggle("aberto")));

/* --- lightbox --- */
(function () {
  const lb = $("#lightbox"), img = $("img", lb);
  let atual = 0, ultimo = null;
  const mostrar = (i) => { atual = (i + GALERIA.length) % GALERIA.length; img.src = GALERIA[atual].src; img.alt = GALERIA[atual].txt; };
  const g = document;
  g.addEventListener("click", (e) => { const f = e.target.closest("figure[data-i]"); if (!f) return; ultimo = f; mostrar(+f.dataset.i); lb.classList.add("on"); $(".lb-fechar", lb).focus(); });
  g.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("figure[data-i]")) { e.preventDefault(); e.target.click(); } });
  const fechar = () => { lb.classList.remove("on"); ultimo && ultimo.focus(); };
  $(".lb-fechar", lb).onclick = fechar;
  $(".lb-ant", lb).onclick = () => mostrar(atual - 1);
  $(".lb-seg", lb).onclick = () => mostrar(atual + 1);
  lb.addEventListener("click", (e) => { if (e.target === lb) fechar(); });
  addEventListener("keydown", (e) => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") fechar();
    if (e.key === "ArrowLeft") mostrar(atual - 1);
    if (e.key === "ArrowRight") mostrar(atual + 1);
  });
})();

/* --- marcação --- */
const estado = { serv: null, dia: null, hora: null };
const sel = $("#servico");
const cats = { cortes: "Cortes & barba", combos: "Combos", cor: "Cor" };
sel.innerHTML += Object.entries(cats).map(([c, n]) =>
  `<optgroup label="${n}">${SERVICOS.filter((s) => s.cat === c).map((s) => `<option value="${s.id}">${esc(s.nome)} · ${euro(s)}</option>`).join("")}</optgroup>`).join("");

function escolherServico(id) {
  sel.value = id;
  estado.serv = SERVICOS.find((s) => s.id === id) || null;
  estado.hora = null;
  $("#p2").classList.toggle("inativo", !estado.serv);
  desenharDias(); atualizar();
}
sel.addEventListener("change", () => escolherServico(sel.value));

function diasDisponiveis() {
  const out = [];
  for (let i = 0; i < DIAS_A_MOSTRAR; i++) {
    const d = new Date(AGORA.data); d.setDate(d.getDate() + i);
    if (HORARIO[d.getDay()]) out.push({ d, hoje: i === 0 });
  }
  return out;
}
function horasPara(dia) {
  const h = HORARIO[dia.d.getDay()], dd = estado.serv ? estado.serv.min : 30, res = [];
  for (let m = paraMin(h[0]); m + dd <= paraMin(h[1]); m += INTERVALO_MIN) {
    if (dia.hoje && m <= AGORA.min + 30) continue;
    res.push(m);
  }
  return res;
}
function desenharDias() {
  const dias = diasDisponiveis().filter((d) => horasPara(d).length);
  if (!estado.dia || !dias.some((d) => +d.d === +estado.dia.d)) estado.dia = dias[0] || null;
  $("#dias").innerHTML = dias.map((d, i) => `
    <button class="dia" data-i="${i}" aria-pressed="${!!estado.dia && +d.d === +estado.dia.d}">
      <small>${d.hoje ? "Hoje" : DIAS_SEM[d.d.getDay()]}</small><strong>${d.d.getDate()}</strong><small>${MESES[d.d.getMonth()]}</small>
    </button>`).join("");
  $("#dias").onclick = (e) => { const b = e.target.closest(".dia"); if (!b) return; estado.dia = dias[+b.dataset.i]; estado.hora = null; desenharDias(); atualizar(); };
  desenharHoras();
}
function desenharHoras() {
  const box = $("#horas");
  if (!estado.dia) { box.innerHTML = `<p class="vazio">Sem horários nos próximos dias. Liga-nos!</p>`; return; }
  box.innerHTML = horasPara(estado.dia).map((m) => `<button class="hora" data-m="${m}" aria-pressed="${estado.hora === m}">${paraHora(m)}</button>`).join("");
  box.onclick = (e) => { const b = e.target.closest(".hora"); if (!b) return; estado.hora = +b.dataset.m; desenharHoras(); atualizar(); };
}
function quandoTxt() {
  if (!estado.dia || estado.hora == null) return null;
  const d = estado.dia.d;
  return `${DIAS_LONGO[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} · ${paraHora(estado.hora)}`;
}
function atualizar() {
  const s = estado.serv;
  $("#r-serv").textContent = s ? s.nome : "—";
  $("#r-dur").textContent = s ? dur(s.min) : "—";
  $("#r-preco").textContent = s ? euro(s) : "—";
  $("#r-quando").textContent = quandoTxt() || "—";
  if (s && estado.dia && estado.hora != null) {
    const d = estado.dia.d;
    $("#r-n").textContent = `Nº ${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}-${paraHora(estado.hora).replace(":", "")} · Camazo Barbershop`;
  }
  $("#p3").classList.toggle("inativo", !(s && estado.hora != null));
  const nome = $("#nome").value.trim(), tel = $("#tel").value.replace(/\D/g, "");
  $("#enviar").disabled = !(s && estado.hora != null && nome.length > 1 && tel.length >= 9);
}
["#nome", "#tel"].forEach((id) => $(id).addEventListener("input", atualizar));
$("#enviar").addEventListener("click", () => {
  const s = estado.serv;
  const msg = [
    "Olá Camazo! Gostava de marcar:",
    `✂️ ${s.nome} (${euro(s)})`,
    `📅 ${quandoTxt()}`,
    `👤 ${$("#nome").value.trim()}`,
    `📱 ${$("#tel").value.trim()}`,
    "",
    "Pode confirmar? Obrigado!",
  ].join("\n");
  window.open(`https://wa.me/${TELEFONE}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
  $("#ok").classList.add("on");
});
desenharDias(); atualizar();

</script>
</body>
