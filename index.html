<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sites</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1b1b1d; --suave: #6b6b72; --card: #fff; --linha: #e4e2dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f0; --suave: #9a9aa2; --card: #1b1b1e; --linha: #2c2c31; } }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 64px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 24px; }
  a { display: block; padding: 18px 20px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--linha); border-radius: 14px; color: inherit; text-decoration: none; }
  a:hover { border-color: var(--suave); }
  a strong { display: block; font-size: 1.05rem; }
  a span { color: var(--suave); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Sites</h1>
  <a href="https://casa-do-cafe.netlify.app/"><strong>Casa do Café</strong><span>Aveiro · desde 1971</span></a>
  <a href="https://camazo-barbershop.netlify.app/"><strong>Camazo Barbershop</strong><span>Aveiro · galeria e marcações</span></a>
</main>
</body>
</html>
